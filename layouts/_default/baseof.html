<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }}</title>
  <link rel="stylesheet" href="{{ "css/dos.css" | relURL }}">
</head>
<body>
  <nav class="dos-nav">
    <span class="dos-title">{{ .Site.Title }}</span>
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
  </nav>
  <main class="dos-container">
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
