<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ .Site.Title }}</title>
  <link rel="stylesheet" href="/css/dos.css">
</head>
<body>
  <nav class="dos-nav">
    <span class="dos-title">{{ .Site.Title }}</span>
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
  </nav>
  <main class="dos-container">
    {{ .Content }}
  </main>
</body>
</html>
